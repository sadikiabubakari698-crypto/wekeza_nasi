<svg viewBox="0 0 380 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#c9962c" stroke-width="1.5"/></marker></defs>

<rect x="50" y="20" width="280" height="70" rx="8" fill="#fbf1de" stroke="#c9962c"/>
<text x="190" y="42" text-anchor="middle" font-weight="bold" font-size="15" fill="#7a5a10">1. Tarehe ya Tangazo</text>
<text x="190" y="62" text-anchor="middle" font-size="12" fill="#3a3a3a">Kampuni yatangaza itatoa</text>
<text x="190" y="78" text-anchor="middle" font-size="12" fill="#3a3a3a">gawio na kiasi chake</text>
<line x1="190" y1="90" x2="190" y2="120" stroke="#c9962c" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="50" y="120" width="280" height="70" rx="8" fill="#e8f5ea" stroke="#2f8f4e"/>
<text x="190" y="142" text-anchor="middle" font-weight="bold" font-size="15" fill="#1b5e30">2. Cum-Dividend</text>
<text x="190" y="162" text-anchor="middle" font-size="12" fill="#3a3a3a">Siku ya mwisho ya kununua</text>
<text x="190" y="178" text-anchor="middle" font-size="12" fill="#3a3a3a">hisa ili upate gawio</text>
<line x1="190" y1="190" x2="190" y2="220" stroke="#c9962c" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="50" y="220" width="280" height="70" rx="8" fill="#f0f0f0" stroke="#888"/>
<text x="190" y="242" text-anchor="middle" font-weight="bold" font-size="15" fill="#333">3. Ex-Dividend</text>
<text x="190" y="262" text-anchor="middle" font-size="12" fill="#3a3a3a">Ukinunua kuanzia hapa,</text>
<text x="190" y="278" text-anchor="middle" font-size="12" fill="#3a3a3a">HUTAPATA gawio hili</text>
<line x1="190" y1="290" x2="190" y2="320" stroke="#c9962c" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="50" y="320" width="280" height="70" rx="8" fill="#fbf1de" stroke="#c9962c"/>
<text x="190" y="342" text-anchor="middle" font-weight="bold" font-size="15" fill="#7a5a10">4. Record Date</text>
<text x="190" y="362" text-anchor="middle" font-size="12" fill="#3a3a3a">Kampuni yafunga orodha</text>
<text x="190" y="378" text-anchor="middle" font-size="12" fill="#3a3a3a">rasmi ya watakaolipwa</text>
<line x1="190" y1="390" x2="190" y2="420" stroke="#c9962c" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="50" y="420" width="280" height="70" rx="8" fill="#e8f5ea" stroke="#2f8f4e"/>
<text x="190" y="442" text-anchor="middle" font-weight="bold" font-size="15" fill="#1b5e30">5. Tarehe ya Malipo</text>
<text x="190" y="462" text-anchor="middle" font-size="12" fill="#3a3a3a">Pesa halisi zaingia</text>
<text x="190" y="478" text-anchor="middle" font-size="12" fill="#3a3a3a">akaunti yako au hundi</text>
</svg>
